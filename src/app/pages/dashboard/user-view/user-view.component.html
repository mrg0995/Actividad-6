<section>
    @if(!employee()){
    <p>Cargando.....</p>
    }@else{
    <article class="card shadow-sm">
        <h4 class="ms-2">{{employee()?.first_name}} {{employee()?.last_name}}</h4>
        <ul class="list-group list-group-flush">
            <li class="list-group-item">username: {{employee()?.username}}</li>
            <li class="list-group-item">Email: {{employee()?.email}}</li>
            <li class="list-group-item">image: {{employee()?.image}}</li>
            <li class="list-group-item">password: {{employee()?.password}}</li>
        </ul>
    </article>
    }
</section>
